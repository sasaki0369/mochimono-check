<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF6ED;
    --paper-deep: #F2EBDB;
    --line: #DED2B4;
    --ink: #2E2A22;
    --ink-soft: #7A7261;
    --biz: #2E4A56;          /* 持ち物バッグの色 */
    --biz-bg: #DCE7E9;
    --sorry: #B23A22;        /* チェックマークの朱色 */
    --sorry-bg: #F5DFD6;
    --gold: #A5813C;
    --shadow: 0 1px 0 rgba(46,42,34,0.06);
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(165,129,60,0.05), transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", sans-serif;
    min-height:100vh;
    padding: 20px 14px 60px;
  }

  .wrap{ max-width: 640px; margin: 0 auto; }

  header{
    text-align:center;
    margin-bottom: 18px;
  }
  header h1{
    font-family: "Shippori Mincho", serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.06em;
    margin: 0 0 4px;
    color: var(--ink);
  }
  header p{
    margin:0;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .card{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }

  .card h2{
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 10px;
    color: var(--biz);
    display:flex;
    align-items:center;
    gap:6px;
  }

  /* -------- 日付ナビ -------- */
  .datenav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 8px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }
  .datenav button{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    width: 38px;
    height: 38px;
    font-size: 18px;
    color: var(--biz);
    cursor:pointer;
  }
  .datenav button:active{ transform: scale(0.95); }
  .datebox{
    flex:1;
    text-align:center;
  }
  .datebox .big{
    font-family: "Shippori Mincho", serif;
    font-size: 19px;
    font-weight: 700;
  }
  .datebox .small{
    font-size: 11px;
    color: var(--ink-soft);
  }
  .datebox input[type=date]{
    border:none;
    background:transparent;
    font-family: inherit;
    font-size: 12px;
    color: var(--gold);
    text-align:center;
  }
  .todaybtn{
    width:auto !important;
    padding: 0 10px;
    font-size: 12px !important;
    white-space:nowrap;
  }

  /* -------- 日程登録 -------- */
  .trip-row{
    display:flex;
    align-items:flex-end;
    gap: 10px;
    flex-wrap: wrap;
  }
  .trip-field{
    display:flex;
    flex-direction:column;
    gap: 4px;
    flex: 1;
    min-width: 120px;
  }
  .trip-field label{
    font-size: 11px;
    color: var(--ink-soft);
  }
  .trip-field input[type=date]{
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 10px;
  }
  #tripSaveBtn{
    background: var(--biz);
    color:#fff;
    border:none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  #tripSaveBtn:active{ transform: scale(0.97); }
  .trip-nights{
    margin-top: 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--biz-bg);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .trip-nights .tn-text{
    font-family: "Shippori Mincho", serif;
    font-weight:700;
    font-size: 16px;
    color: var(--biz);
  }
  .trip-clear-btn{
    background:none;
    border:none;
    color: var(--sorry);
    font-size: 12px;
    cursor:pointer;
  }

  textarea, input[type=text]{
    width:100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    resize: vertical;
  }
  textarea{ min-height: 56px; }
  textarea:focus, input[type=text]:focus{ outline: 2px solid var(--gold); outline-offset:1px; }

  /* -------- チェックリスト -------- */
  .item-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }
  .item-row:last-child{ border-bottom:none; }
  .item-row.checked .item-name{
    text-decoration: line-through;
    color: var(--ink-soft);
  }
  .chk{
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--biz);
    background: #fff;
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--sorry);
    font-weight:900;
    font-size: 16px;
  }
  .item-row.checked .chk{
    background: var(--biz-bg);
  }
  .item-name{
    flex:1;
    font-size: 15px;
  }
  .qty-select{
    font-family: inherit;
    font-size: 12px;
    color: var(--biz);
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 6px;
    flex-shrink:0;
  }
  .qty-select:focus{ outline: 2px solid var(--gold); outline-offset:1px; }
  .item-row.checked .qty-select{ color: var(--ink-soft); }
  .del-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 18px;
    cursor:pointer;
    padding: 4px 6px;
    line-height:1;
  }
  .empty-msg{
    text-align:center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 18px 0;
  }

  .progress-line{
    font-size: 12px;
    color: var(--ink-soft);
    text-align:right;
    margin-top: 4px;
  }

  /* -------- 追加エリア -------- */
  .add-row{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .add-row input{ flex:1; }
  .add-row button{
    background: var(--biz);
    color:#fff;
    border:none;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 14px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-row button:active{ transform: scale(0.97); }

  .chip-label{
    font-size: 11px;
    color: var(--ink-soft);
    margin: 4px 0 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .edit-toggle-btn{
    background:none;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--gold);
    font-size: 11px;
    padding: 3px 10px;
    cursor:pointer;
  }
  .edit-toggle-btn.on{
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
  }
  .edit-list{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .edit-item-row{
    display:flex;
    flex-direction: column;
    gap: 8px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
  }
  .edit-item-row .edit-row-top{
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .edit-item-row .edit-row-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 6px;
  }
  .edit-name-input{
    flex:1;
    font-size: 13px;
    padding: 6px 8px;
  }
  .auto-qty-label{
    display:flex;
    align-items:center;
    gap: 5px;
    font-size: 12px;
    color: var(--ink-soft);
    white-space:nowrap;
  }
  .edit-save-btn, .edit-del-btn{
    border:none;
    border-radius: 8px;
    font-size: 12px;
    padding: 7px 10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .edit-save-btn{
    background: var(--biz);
    color:#fff;
  }
  .edit-del-btn{
    background: #fff;
    border: 1px solid var(--sorry);
    color: var(--sorry);
  }
  .edit-del-btn.confirm{
    background: var(--sorry);
    color:#fff;
  }
  .chip{
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .chip:active{ transform: scale(0.96); }
  .chip.added{
    background: var(--biz-bg);
    color: var(--biz);
    border-color: var(--biz);
  }
  .chip .cnt{
    font-size: 10px;
    color: var(--gold);
    font-weight:700;
  }

  .sync-status{
    text-align:center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  .sync-status.err{ color: var(--sorry); }

  /* -------- 登録済みの日一覧 -------- */
  .daylist-card h2{ margin-bottom: 6px; }
  .daylist-toggle{
    background:none;
    border:none;
    color: var(--gold);
    font-size: 12px;
    cursor:pointer;
    margin-left:auto;
  }
  .daylist{
    display:flex;
    flex-direction:column;
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
  }
  .daylist.collapsed{ display:none; }
  .day-entry{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    cursor:pointer;
  }
  .day-entry:active{ transform: scale(0.98); }
  .day-entry.today{ border-color: var(--biz); }
  .day-entry .de-date{
    font-family: "Shippori Mincho", serif;
    font-weight:700;
    font-size: 14px;
    min-width: 92px;
  }
  .day-entry .de-sched{
    flex:1;
    font-size: 12px;
    color: var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .day-entry .de-progress{
    font-size: 11px;
    color: var(--biz);
    font-weight:700;
    white-space:nowrap;
  }
  .day-entry .de-progress.done{ color: var(--gold); }

  /* -------- ログイン画面 -------- */
  #loginScreen{
    max-width: 340px;
    margin: 80px auto 0;
    text-align:center;
    padding: 28px 20px;
  }
  #loginScreen p{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 6px 0 20px;
  }
  #googleLoginBtn{
    background: var(--biz);
    color:#fff;
    border:none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight:700;
    cursor:pointer;
    width:100%;
  }
  #googleLoginBtn:active{ transform: scale(0.98); }
  #appRoot.hidden{ display:none; }
</style>
</head>
<body>
<div class="card" id="loginScreen" style="display:none;">
  <h2 style="justify-content:center;">🔐 ログインが必要です</h2>
  <p>このアプリはGoogleアカウントでのログインが必要です。<br>登録済みのアカウントでログインしてください。</p>
  <button id="googleLoginBtn">Googleでログイン</button>
</div>
<div class="wrap" id="appRoot">

  <header>
    <h1>持ち物チェック</h1>
    <p>その日の予定と持ち物をまとめて管理</p>
  </header>

  <div class="card daylist-card">
    <h2 style="display:flex;align-items:center;">📅 持ち物が登録されている日
      <button class="daylist-toggle" id="daylistToggleBtn">閉じる</button>
    </h2>
    <div class="daylist" id="dayListContainer"></div>
  </div>

  <div class="datenav">
    <button id="prevDayBtn">‹</button>
    <div class="datebox">
      <div class="big" id="dateBig">-</div>
      <input type="date" id="datePicker">
    </div>
    <button id="todayBtn" class="todaybtn">今日</button>
    <button id="nextDayBtn">›</button>
  </div>

  <div class="card">
    <h2>🗓 日程登録</h2>
    <div class="trip-row">
      <div class="trip-field">
        <label for="tripStartInput">出発日</label>
        <input type="date" id="tripStartInput">
      </div>
      <div class="trip-field">
        <label for="tripEndInput">帰着日</label>
        <input type="date" id="tripEndInput">
      </div>
      <button id="tripSaveBtn">登録</button>
    </div>
    <div class="trip-nights" id="tripNightsBox" style="display:none;">
      <span class="tn-text" id="tripNightsText"></span>
      <button class="trip-clear-btn" id="tripClearBtn">解除</button>
    </div>
  </div>

  <div class="card">
    <h2>📋 予定概要</h2>
    <textarea id="scheduleInput" placeholder="例：出張／子どもの遠足／日帰り旅行 など"></textarea>
  </div>

  <div class="card">
    <h2>🎒 持ち物リスト</h2>
    <div id="itemList"></div>
    <div class="progress-line" id="progressLine"></div>
  </div>

  <div class="card">
    <h2>➕ 持ち物を追加</h2>
    <div class="add-row">
      <input type="text" id="freeTextInput" placeholder="自由記述で持ち物を入力">
      <select class="qty-select" id="addQtySelect">
        <option value="1">×1</option>
        <option value="2">×2</option>
        <option value="3">×3</option>
        <option value="4">×4</option>
        <option value="5">×5</option>
      </select>
      <button id="addFreeTextBtn">追加</button>
    </div>
    <div class="chip-label">
      <span>よく使う持ち物（使用回数順・タップで上の数量で追加）</span>
      <button class="edit-toggle-btn" id="editToggleBtn">編集</button>
    </div>
    <div class="chips" id="masterChips"></div>
  </div>

  <div class="sync-status" id="syncStatus">Firebase接続中…</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAxVn7JUuoBsNeSODksNYyEkd2W2E252_c",
    authDomain: "life--log.firebaseapp.com",
    databaseURL: "https://life--log-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "life--log",
    storageBucket: "life--log.firebasestorage.app",
    messagingSenderId: "790653257684",
    appId: "1:790653257684:web:dd84bf5e0a38db328f3841"
  };

  var app = null, db = null, auth = null;
  var ROOT = "mochimonoCheck";
  try{
    app = firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    auth = firebase.auth();
  }catch(e){
    console.error(e);
  }

  var syncStatusEl = document.getElementById("syncStatus");
  function setSyncStatus(text, isErr){
    syncStatusEl.textContent = text;
    syncStatusEl.className = "sync-status" + (isErr ? " err" : "");
  }

  var masterItems = {}; // { id: {name, count} }
  var currentDate = new Date();
  var currentDayData = { schedule: "", items: {}, trip: null };
  var dayRef = null;
  var scheduleTimer = null;

  var WEEKDAYS = ["日","月","火","水","木","金","土"];

  function fmtDate(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return y + "-" + m + "-" + day;
  }

  function fmtBig(d){
    return (d.getMonth()+1) + "月" + d.getDate() + "日（" + WEEKDAYS[d.getDay()] + "）";
  }

  // 名前から安定したキーを作る簡易ハッシュ（Firebaseキーに使えない文字を避ける）
  function nameToId(name){
    var h = 5381;
    for(var i=0;i<name.length;i++){
      h = ((h*33) ^ name.charCodeAt(i)) >>> 0;
    }
    return "it_" + h.toString(36);
  }

  function renderDateNav(){
    document.getElementById("dateBig").textContent = fmtBig(currentDate);
    document.getElementById("datePicker").value = fmtDate(currentDate);
  }

  function renderSchedule(){
    var el = document.getElementById("scheduleInput");
    if(document.activeElement !== el){
      el.value = currentDayData.schedule || "";
    }
  }

  // "YYYY-MM-DD" 文字列を Date に変換
  function parseDateStr(ds){
    var parts = (ds||"").split("-");
    if(parts.length !== 3) return null;
    return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  }

  // 出発日〜帰着日から泊数を計算（例：8/1〜8/3 なら2泊3日 → nights=2）
  function computeNights(startStr, endStr){
    var s = parseDateStr(startStr), e = parseDateStr(endStr);
    if(!s || !e) return 0;
    var diff = Math.round((e.getTime() - s.getTime()) / 86400000);
    return diff > 0 ? diff : 0;
  }

  function renderTrip(){
    var trip = currentDayData.trip;
    var startInput = document.getElementById("tripStartInput");
    var endInput = document.getElementById("tripEndInput");
    var box = document.getElementById("tripNightsBox");
    var text = document.getElementById("tripNightsText");

    if(trip && trip.start && trip.end){
      if(document.activeElement !== startInput) startInput.value = trip.start;
      if(document.activeElement !== endInput) endInput.value = trip.end;
      var nights = computeNights(trip.start, trip.end);
      var days = nights + 1;
      box.style.display = "flex";
      text.textContent = nights > 0 ? (nights + "泊" + days + "日") : "日帰り";
    } else {
      if(document.activeElement !== startInput) startInput.value = fmtDate(currentDate);
      if(document.activeElement !== endInput) endInput.value = "";
      box.style.display = "none";
    }
  }

  function renderItemList(){
    var container = document.getElementById("itemList");
    var items = currentDayData.items || {};
    var ids = Object.keys(items);
    // チェック未済を先に、チェック済みを後ろに。同グループ内は追加順(名前)でソート
    ids.sort(function(a,b){
      var ia = items[a], ib = items[b];
      if(!!ia.checked !== !!ib.checked) return ia.checked ? 1 : -1;
      return (ia.name||"").localeCompare(ib.name||"", "ja");
    });

    if(ids.length === 0){
      container.innerHTML = '<div class="empty-msg">まだ持ち物が登録されていません。下から追加してください。</div>';
    } else {
      container.innerHTML = ids.map(function(id){
        var it = items[id];
        var checkedClass = it.checked ? " checked" : "";
        var mark = it.checked ? "✔" : "";
        var qty = it.qty || 1;
        var maxOpt = Math.max(5, qty);
        var options = "";
        for(var n=1; n<=maxOpt; n++){
          options += '<option value="' + n + '"' + (n === qty ? " selected" : "") + '>×' + n + '</option>';
        }
        return '<div class="item-row' + checkedClass + '" data-id="' + id + '">' +
          '<div class="chk" data-action="toggle">' + mark + '</div>' +
          '<div class="item-name">' + escapeHtml(it.name) + '</div>' +
          '<select class="qty-select" data-action="qty">' + options + '</select>' +
          '<button class="del-btn" data-action="del">✕</button>' +
        '</div>';
      }).join("");
    }

    var total = ids.length;
    var done = ids.filter(function(id){ return items[id].checked; }).length;
    document.getElementById("progressLine").textContent =
      total === 0 ? "" : ("チェック済み " + done + " / " + total);
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  var editMode = false;

  function renderMasterChips(){
    var container = document.getElementById("masterChips");
    var ids = Object.keys(masterItems);
    ids.sort(function(a,b){
      var ca = masterItems[a].count || 0, cb = masterItems[b].count || 0;
      if(cb !== ca) return cb - ca;
      return (masterItems[a].name||"").localeCompare(masterItems[b].name||"", "ja");
    });
    if(ids.length === 0){
      container.innerHTML = '<div class="empty-msg" style="padding:6px 0;">まだ登録された持ち物がありません</div>';
      container.className = editMode ? "edit-list" : "chips";
      return;
    }

    if(editMode){
      container.className = "edit-list";
      container.innerHTML = ids.map(function(id){
        var it = masterItems[id];
        var checked = it.autoQty ? " checked" : "";
        return '<div class="edit-item-row" data-id="' + id + '">' +
          '<div class="edit-row-top">' +
            '<input type="text" class="edit-name-input" value="' + escapeHtml(it.name) + '">' +
            '<button class="edit-save-btn" data-action="save">保存</button>' +
          '</div>' +
          '<div class="edit-row-bottom">' +
            '<label class="auto-qty-label"><input type="checkbox" class="auto-qty-checkbox" data-action="autoqty"' + checked + '> 泊数分を自動で数量に反映</label>' +
            '<button class="edit-del-btn" data-action="del">削除</button>' +
          '</div>' +
        '</div>';
      }).join("");
    } else {
      container.className = "chips";
      var dayItems = currentDayData.items || {};
      container.innerHTML = ids.map(function(id){
        var it = masterItems[id];
        var added = !!dayItems[id];
        return '<div class="chip' + (added ? " added" : "") + '" data-id="' + id + '" data-name="' + escapeHtml(it.name) + '">' +
          escapeHtml(it.name) +
          '<span class="cnt">' + (it.count||0) + '</span>' +
        '</div>';
      }).join("");
    }
  }

  function handleWriteError(e){
    console.error(e);
    var msg = (e && e.message) ? e.message : String(e);
    setSyncStatus("書き込みエラー: " + msg, true);
  }

  function addItemToDay(id, name, isNewMaster, qty){
    if(!db){ setSyncStatus("Firebase未接続のため追加できません", true); return; }
    qty = qty || 1;
    var dateStr = fmtDate(currentDate);
    var updates = {};
    updates[ROOT + "/days/" + dateStr + "/items/" + id] = { name: name, checked: false, qty: qty };
    if(isNewMaster){
      updates[ROOT + "/masterItems/" + id] = { name: name, count: 1 };
    } else {
      var cur = (masterItems[id] && masterItems[id].count) || 0;
      updates[ROOT + "/masterItems/" + id + "/count"] = cur + 1;
      updates[ROOT + "/masterItems/" + id + "/name"] = name;
    }
    db.ref().update(updates).then(function(){
      setSyncStatus("同期中");
    }).catch(handleWriteError);
  }

  function updateItemQty(id, qty){
    if(!db){ setSyncStatus("Firebase未接続です", true); return; }
    var dateStr = fmtDate(currentDate);
    db.ref(ROOT + "/days/" + dateStr + "/items/" + id + "/qty").set(qty).catch(handleWriteError);
  }

  function saveTrip(start, end){
    if(!db){ setSyncStatus("Firebase未接続です", true); return; }
    var nights = computeNights(start, end);
    if(nights <= 0){
      setSyncStatus("帰着日は出発日より後の日付にしてください", true);
      return;
    }
    var dateStr = fmtDate(currentDate);
    var updates = {};
    updates[ROOT + "/days/" + dateStr + "/trip"] = { start: start, end: end };
    // 泊数分自動反映の対象アイテムは、登録済みならこのタイミングで数量を更新
    var items = currentDayData.items || {};
    Object.keys(items).forEach(function(id){
      if(masterItems[id] && masterItems[id].autoQty){
        updates[ROOT + "/days/" + dateStr + "/items/" + id + "/qty"] = nights;
      }
    });
    db.ref().update(updates).then(function(){
      setSyncStatus("同期中");
    }).catch(handleWriteError);
  }

  function clearTrip(){
    if(!db){ setSyncStatus("Firebase未接続です", true); return; }
    var dateStr = fmtDate(currentDate);
    db.ref(ROOT + "/days/" + dateStr + "/trip").remove().catch(handleWriteError);
  }

  function renameMasterItem(id, newName){
    if(!db){ setSyncStatus("Firebase未接続です", true); return; }
    db.ref(ROOT + "/masterItems/" + id + "/name").set(newName)
      .then(function(){ setSyncStatus("同期中"); })
      .catch(handleWriteError);
  }

  function deleteMasterItem(id){
    if(!db){ setSyncStatus("Firebase未接続です", true); return; }
    db.ref(ROOT + "/masterItems/" + id).remove()
      .then(function(){ setSyncStatus("同期中"); })
      .catch(handleWriteError);
  }

  function setMasterAutoQty(id, flag){
    if(!db){ setSyncStatus("Firebase未接続です", true); return; }
    db.ref(ROOT + "/masterItems/" + id + "/autoQty").set(!!flag)
      .then(function(){
        setSyncStatus("同期中");
        // 既にこの日のリストに入っている場合は、泊数に応じて数量を即反映
        if(flag && currentDayData.trip && currentDayData.items && currentDayData.items[id]){
          var nights = computeNights(currentDayData.trip.start, currentDayData.trip.end);
          if(nights > 0) updateItemQty(id, nights);
        }
      })
      .catch(handleWriteError);
  }

  function toggleItem(id){
    if(!db){ setSyncStatus("Firebase未接続です", true); return; }
    var dateStr = fmtDate(currentDate);
    var cur = currentDayData.items && currentDayData.items[id];
    if(!cur) return;
    db.ref(ROOT + "/days/" + dateStr + "/items/" + id + "/checked").set(!cur.checked)
      .catch(handleWriteError);
  }

  function deleteItemFromDay(id){
    if(!db){ setSyncStatus("Firebase未接続です", true); return; }
    var dateStr = fmtDate(currentDate);
    db.ref(ROOT + "/days/" + dateStr + "/items/" + id).remove().catch(handleWriteError);
  }

  function attachDayListener(){
    if(!db) return;
    if(dayRef) dayRef.off();
    var dateStr = fmtDate(currentDate);
    dayRef = db.ref(ROOT + "/days/" + dateStr);
    dayRef.on("value", function(snap){
      var val = snap.val() || {};
      currentDayData = {
        schedule: val.schedule || "",
        items: val.items || {},
        trip: val.trip || null
      };
      renderSchedule();
      renderTrip();
      renderItemList();
      renderMasterChips();
    }, function(err){
      setSyncStatus("同期エラー: " + err.message, true);
    });
  }

  function attachMasterListener(){
    if(!db) return;
    db.ref(ROOT + "/masterItems").on("value", function(snap){
      masterItems = snap.val() || {};
      renderMasterChips();
      setSyncStatus("同期中");
    }, function(err){
      setSyncStatus("同期エラー: " + err.message, true);
    });
  }

  var allDaysData = {};

  function attachAllDaysListener(){
    if(!db) return;
    db.ref(ROOT + "/days").on("value", function(snap){
      allDaysData = snap.val() || {};
      renderDayList();
    }, function(err){
      setSyncStatus("同期エラー: " + err.message, true);
    });
  }

  function renderDayList(){
    var container = document.getElementById("dayListContainer");
    var todayStr = fmtDate(new Date());
    var dateStrs = Object.keys(allDaysData).filter(function(ds){
      var items = allDaysData[ds] && allDaysData[ds].items;
      return items && Object.keys(items).length > 0;
    });
    // 新しい日付が上に来るよう降順ソート（ISO形式なので文字列比較でOK）
    dateStrs.sort(function(a,b){ return b.localeCompare(a); });

    if(dateStrs.length === 0){
      container.innerHTML = '<div class="empty-msg" style="padding:8px 0;">まだ持ち物が登録されている日がありません</div>';
      return;
    }

    container.innerHTML = dateStrs.map(function(ds){
      var dayData = allDaysData[ds];
      var items = dayData.items || {};
      var ids = Object.keys(items);
      var total = ids.length;
      var done = ids.filter(function(id){ return items[id].checked; }).length;
      var parts = ds.split("-");
      var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
      var dateLabel = (parseInt(parts[1],10)) + "月" + (parseInt(parts[2],10)) + "日（" + WEEKDAYS[d.getDay()] + "）";
      var sched = dayData.schedule ? escapeHtml(dayData.schedule) : "";
      var progressClass = (total > 0 && done === total) ? " done" : "";
      var progressText = done + " / " + total;
      var todayClass = (ds === todayStr) ? " today" : "";
      return '<div class="day-entry' + todayClass + '" data-date="' + ds + '">' +
        '<div class="de-date">' + dateLabel + '</div>' +
        '<div class="de-sched">' + sched + '</div>' +
        '<div class="de-progress' + progressClass + '">' + progressText + '</div>' +
      '</div>';
    }).join("");
  }

  function goToDate(d){
    currentDate = d;
    renderDateNav();
    attachDayListener();
  }

  function init(){
    renderDateNav();
    renderTrip();
    renderItemList();
    renderMasterChips();

    document.getElementById("prevDayBtn").addEventListener("click", function(){
      var d = new Date(currentDate);
      d.setDate(d.getDate()-1);
      goToDate(d);
    });
    document.getElementById("nextDayBtn").addEventListener("click", function(){
      var d = new Date(currentDate);
      d.setDate(d.getDate()+1);
      goToDate(d);
    });
    document.getElementById("todayBtn").addEventListener("click", function(){
      goToDate(new Date());
    });
    document.getElementById("datePicker").addEventListener("change", function(e){
      var parts = e.target.value.split("-");
      if(parts.length === 3){
        var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
        goToDate(d);
      }
    });

    document.getElementById("scheduleInput").addEventListener("input", function(e){
      var text = e.target.value;
      clearTimeout(scheduleTimer);
      scheduleTimer = setTimeout(function(){
        if(!db){ setSyncStatus("Firebase未接続です", true); return; }
        var dateStr = fmtDate(currentDate);
        db.ref(ROOT + "/days/" + dateStr + "/schedule").set(text).catch(handleWriteError);
      }, 500);
    });

    document.getElementById("tripSaveBtn").addEventListener("click", function(){
      var start = document.getElementById("tripStartInput").value;
      var end = document.getElementById("tripEndInput").value;
      if(!start || !end){
        setSyncStatus("出発日と帰着日を両方入力してください", true);
        return;
      }
      saveTrip(start, end);
    });

    document.getElementById("tripClearBtn").addEventListener("click", function(){
      clearTrip();
    });

    document.getElementById("itemList").addEventListener("click", function(e){
      var row = e.target.closest(".item-row");
      if(!row) return;
      var id = row.getAttribute("data-id");
      var action = e.target.getAttribute("data-action");
      if(action === "toggle"){
        toggleItem(id);
      } else if(action === "del"){
        deleteItemFromDay(id);
      }
    });

    document.getElementById("itemList").addEventListener("change", function(e){
      if(e.target.getAttribute("data-action") !== "qty") return;
      var row = e.target.closest(".item-row");
      if(!row) return;
      var id = row.getAttribute("data-id");
      updateItemQty(id, parseInt(e.target.value, 10));
    });

    document.getElementById("masterChips").addEventListener("click", function(e){
      if(editMode){
        var row = e.target.closest(".edit-item-row");
        if(!row) return;
        var rid = row.getAttribute("data-id");
        var action = e.target.getAttribute("data-action");
        if(action === "save"){
          var input = row.querySelector(".edit-name-input");
          var newName = input.value.trim();
          if(!newName) return;
          renameMasterItem(rid, newName);
        } else if(action === "del"){
          if(e.target.classList.contains("confirm")){
            deleteMasterItem(rid);
          } else {
            e.target.classList.add("confirm");
            e.target.textContent = "本当に削除？";
            setTimeout(function(){
              e.target.classList.remove("confirm");
              e.target.textContent = "削除";
            }, 3000);
          }
        } else if(action === "autoqty"){
          setMasterAutoQty(rid, e.target.checked);
        }
        return;
      }
      var chip = e.target.closest(".chip");
      if(!chip) return;
      var id = chip.getAttribute("data-id");
      var name = chip.getAttribute("data-name");
      if(currentDayData.items && currentDayData.items[id]){
        return; // 既に追加済み
      }
      addItemToDay(id, name, false, resolveAddQty(id));
    });

    document.getElementById("editToggleBtn").addEventListener("click", function(e){
      editMode = !editMode;
      e.target.classList.toggle("on", editMode);
      e.target.textContent = editMode ? "完了" : "編集";
      renderMasterChips();
    });

    document.getElementById("addFreeTextBtn").addEventListener("click", submitFreeText);
    document.getElementById("freeTextInput").addEventListener("keydown", function(e){
      if(e.key === "Enter") submitFreeText();
    });

    // 泊数分自動反映が有効な持ち物は、日程が登録済みなら数量を泊数に合わせる。
    // 新規（マスタ未登録）の自由記述はまだautoQtyフラグが無いため、プルダウンの値をそのまま使う。
    function resolveAddQty(id){
      var manualQty = parseInt(document.getElementById("addQtySelect").value, 10) || 1;
      if(masterItems[id] && masterItems[id].autoQty && currentDayData.trip){
        var nights = computeNights(currentDayData.trip.start, currentDayData.trip.end);
        if(nights > 0) return nights;
      }
      return manualQty;
    }

    function submitFreeText(){
      var input = document.getElementById("freeTextInput");
      var name = input.value.trim();
      if(!name) return;
      var id = nameToId(name);
      var isNew = !masterItems[id];
      addItemToDay(id, name, isNew, resolveAddQty(id));
      input.value = "";
    }

    document.getElementById("dayListContainer").addEventListener("click", function(e){
      var entry = e.target.closest(".day-entry");
      if(!entry) return;
      var ds = entry.getAttribute("data-date");
      var parts = ds.split("-");
      var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
      goToDate(d);
      document.querySelector(".datenav").scrollIntoView({ behavior: "smooth", block: "center" });
    });

    document.getElementById("daylistToggleBtn").addEventListener("click", function(e){
      var list = document.getElementById("dayListContainer");
      var collapsed = list.classList.toggle("collapsed");
      e.target.textContent = collapsed ? "開く" : "閉じる";
    });

    startSync();
  }

  function showApp(show){
    document.getElementById("appRoot").classList.toggle("hidden", !show);
    document.getElementById("loginScreen").style.display = show ? "none" : "block";
  }

  function startSync(){
    if(!db || !auth){ setSyncStatus("Firebase初期化エラー", true); showApp(false); return; }

    document.getElementById("googleLoginBtn").addEventListener("click", function(){
      var provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithRedirect(provider);
    });

    auth.getRedirectResult().catch(function(e){
      console.error(e);
      setSyncStatus("ログインエラー: " + e.message, true);
    });

    auth.onAuthStateChanged(function(user){
      if(user){
        showApp(true);
        attachDayListener();
        attachMasterListener();
        attachAllDaysListener();
      } else {
        showApp(false);
      }
    });
  }

  init();
})();
</script>
</body>
</html>
