<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF6ED;
    --paper-deep: #F2EBDB;
    --line: #DED2B4;
    --ink: #2E2A22;
    --ink-soft: #7A7261;
    --biz: #2E4A56;          /* 持ち物バッグの色 */
    --biz-bg: #DCE7E9;
    --sorry: #B23A22;        /* チェックマークの朱色 */
    --sorry-bg: #F5DFD6;
    --gold: #A5813C;
    --shadow: 0 1px 0 rgba(46,42,34,0.06);
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(165,129,60,0.05), transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", sans-serif;
    min-height:100vh;
    padding: 20px 14px 60px;
  }

  .wrap{ max-width: 640px; margin: 0 auto; }

  header{
    text-align:center;
    margin-bottom: 18px;
  }
  header h1{
    font-family: "Shippori Mincho", serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.06em;
    margin: 0 0 4px;
    color: var(--ink);
  }
  header p{
    margin:0;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .card{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }

  .card h2{
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 10px;
    color: var(--biz);
    display:flex;
    align-items:center;
    gap:6px;
  }

  /* -------- 日付ナビ -------- */
  .datenav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 8px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }
  .datenav button{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    width: 38px;
    height: 38px;
    font-size: 18px;
    color: var(--biz);
    cursor:pointer;
  }
  .datenav button:active{ transform: scale(0.95); }
  .datebox{
    flex:1;
    text-align:center;
  }
  .datebox .big{
    font-family: "Shippori Mincho", serif;
    font-size: 19px;
    font-weight: 700;
  }
  .datebox .small{
    font-size: 11px;
    color: var(--ink-soft);
  }
  .datebox input[type=date]{
    border:none;
    background:transparent;
    font-family: inherit;
    font-size: 12px;
    color: var(--gold);
    text-align:center;
  }
  .todaybtn{
    width:auto !important;
    padding: 0 10px;
    font-size: 12px !important;
    white-space:nowrap;
  }

  textarea, input[type=text]{
    width:100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    resize: vertical;
  }
  textarea{ min-height: 56px; }
  textarea:focus, input[type=text]:focus{ outline: 2px solid var(--gold); outline-offset:1px; }

  /* -------- チェックリスト -------- */
  .item-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }
  .item-row:last-child{ border-bottom:none; }
  .item-row.checked .item-name{
    text-decoration: line-through;
    color: var(--ink-soft);
  }
  .chk{
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 2px solid var(--biz);
    background: #fff;
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--sorry);
    font-weight:900;
    font-size: 16px;
  }
  .item-row.checked .chk{
    background: var(--biz-bg);
  }
  .item-name{
    flex:1;
    font-size: 15px;
  }
  .del-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 18px;
    cursor:pointer;
    padding: 4px 6px;
    line-height:1;
  }
  .empty-msg{
    text-align:center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 18px 0;
  }

  .progress-line{
    font-size: 12px;
    color: var(--ink-soft);
    text-align:right;
    margin-top: 4px;
  }

  /* -------- 追加エリア -------- */
  .add-row{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .add-row input{ flex:1; }
  .add-row button{
    background: var(--biz);
    color:#fff;
    border:none;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 14px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-row button:active{ transform: scale(0.97); }

  .chip-label{
    font-size: 11px;
    color: var(--ink-soft);
    margin: 4px 0 8px;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
  }
  .chip{
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .chip:active{ transform: scale(0.96); }
  .chip.added{
    background: var(--biz-bg);
    color: var(--biz);
    border-color: var(--biz);
  }
  .chip .cnt{
    font-size: 10px;
    color: var(--gold);
    font-weight:700;
  }

  .sync-status{
    text-align:center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  .sync-status.err{ color: var(--sorry); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>持ち物チェック</h1>
    <p>その日の予定と持ち物をまとめて管理</p>
  </header>

  <div class="datenav">
    <button id="prevDayBtn">‹</button>
    <div class="datebox">
      <div class="big" id="dateBig">-</div>
      <input type="date" id="datePicker">
    </div>
    <button id="todayBtn" class="todaybtn">今日</button>
    <button id="nextDayBtn">›</button>
  </div>

  <div class="card">
    <h2>📋 予定概要</h2>
    <textarea id="scheduleInput" placeholder="例：出張／子どもの遠足／日帰り旅行 など"></textarea>
  </div>

  <div class="card">
    <h2>🎒 持ち物リスト</h2>
    <div id="itemList"></div>
    <div class="progress-line" id="progressLine"></div>
  </div>

  <div class="card">
    <h2>➕ 持ち物を追加</h2>
    <div class="add-row">
      <input type="text" id="freeTextInput" placeholder="自由記述で持ち物を入力">
      <button id="addFreeTextBtn">追加</button>
    </div>
    <div class="chip-label">よく使う持ち物（使用回数順）</div>
    <div class="chips" id="masterChips"></div>
  </div>

  <div class="sync-status" id="syncStatus">Firebase接続中…</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyB7LNORIYD3AfzuQlN8OFsIVVCZXluHF6s",
    authDomain: "mochimono-check.firebaseapp.com",
    databaseURL: "https://mochimono-check-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mochimono-check",
    storageBucket: "mochimono-check.firebasestorage.app",
    messagingSenderId: "936797393460",
    appId: "1:936797393460:web:6fe414a7393279f74c7061"
  };

  var app = null, db = null;
  var ROOT = "mochimonoCheck";
  try{
    app = firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  }catch(e){
    console.error(e);
  }

  var syncStatusEl = document.getElementById("syncStatus");
  function setSyncStatus(text, isErr){
    syncStatusEl.textContent = text;
    syncStatusEl.className = "sync-status" + (isErr ? " err" : "");
  }

  var masterItems = {}; // { id: {name, count} }
  var currentDate = new Date();
  var currentDayData = { schedule: "", items: {} };
  var dayRef = null;
  var scheduleTimer = null;

  var WEEKDAYS = ["日","月","火","水","木","金","土"];

  function fmtDate(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return y + "-" + m + "-" + day;
  }

  function fmtBig(d){
    return (d.getMonth()+1) + "月" + d.getDate() + "日（" + WEEKDAYS[d.getDay()] + "）";
  }

  // 名前から安定したキーを作る簡易ハッシュ（Firebaseキーに使えない文字を避ける）
  function nameToId(name){
    var h = 5381;
    for(var i=0;i<name.length;i++){
      h = ((h*33) ^ name.charCodeAt(i)) >>> 0;
    }
    return "it_" + h.toString(36);
  }

  function renderDateNav(){
    document.getElementById("dateBig").textContent = fmtBig(currentDate);
    document.getElementById("datePicker").value = fmtDate(currentDate);
  }

  function renderSchedule(){
    var el = document.getElementById("scheduleInput");
    if(document.activeElement !== el){
      el.value = currentDayData.schedule || "";
    }
  }

  function renderItemList(){
    var container = document.getElementById("itemList");
    var items = currentDayData.items || {};
    var ids = Object.keys(items);
    // チェック未済を先に、チェック済みを後ろに。同グループ内は追加順(名前)でソート
    ids.sort(function(a,b){
      var ia = items[a], ib = items[b];
      if(!!ia.checked !== !!ib.checked) return ia.checked ? 1 : -1;
      return (ia.name||"").localeCompare(ib.name||"", "ja");
    });

    if(ids.length === 0){
      container.innerHTML = '<div class="empty-msg">まだ持ち物が登録されていません。下から追加してください。</div>';
    } else {
      container.innerHTML = ids.map(function(id){
        var it = items[id];
        var checkedClass = it.checked ? " checked" : "";
        var mark = it.checked ? "✔" : "";
        return '<div class="item-row' + checkedClass + '" data-id="' + id + '">' +
          '<div class="chk" data-action="toggle">' + mark + '</div>' +
          '<div class="item-name">' + escapeHtml(it.name) + '</div>' +
          '<button class="del-btn" data-action="del">✕</button>' +
        '</div>';
      }).join("");
    }

    var total = ids.length;
    var done = ids.filter(function(id){ return items[id].checked; }).length;
    document.getElementById("progressLine").textContent =
      total === 0 ? "" : ("チェック済み " + done + " / " + total);
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderMasterChips(){
    var container = document.getElementById("masterChips");
    var ids = Object.keys(masterItems);
    ids.sort(function(a,b){
      var ca = masterItems[a].count || 0, cb = masterItems[b].count || 0;
      if(cb !== ca) return cb - ca;
      return (masterItems[a].name||"").localeCompare(masterItems[b].name||"", "ja");
    });
    if(ids.length === 0){
      container.innerHTML = '<div class="empty-msg" style="padding:6px 0;">まだ登録された持ち物がありません</div>';
      return;
    }
    var dayItems = currentDayData.items || {};
    container.innerHTML = ids.map(function(id){
      var it = masterItems[id];
      var added = !!dayItems[id];
      return '<div class="chip' + (added ? " added" : "") + '" data-id="' + id + '" data-name="' + escapeHtml(it.name) + '">' +
        escapeHtml(it.name) +
        '<span class="cnt">' + (it.count||0) + '</span>' +
      '</div>';
    }).join("");
  }

  function addItemToDay(id, name, isNewMaster){
    if(!db) return;
    var dateStr = fmtDate(currentDate);
    var updates = {};
    updates[ROOT + "/days/" + dateStr + "/items/" + id] = { name: name, checked: false };
    if(isNewMaster){
      updates[ROOT + "/masterItems/" + id] = { name: name, count: 1 };
    } else {
      var cur = (masterItems[id] && masterItems[id].count) || 0;
      updates[ROOT + "/masterItems/" + id + "/count"] = cur + 1;
      updates[ROOT + "/masterItems/" + id + "/name"] = name;
    }
    db.ref().update(updates).catch(function(e){ console.error(e); });
  }

  function toggleItem(id){
    if(!db) return;
    var dateStr = fmtDate(currentDate);
    var cur = currentDayData.items && currentDayData.items[id];
    if(!cur) return;
    db.ref(ROOT + "/days/" + dateStr + "/items/" + id + "/checked").set(!cur.checked);
  }

  function deleteItemFromDay(id){
    if(!db) return;
    var dateStr = fmtDate(currentDate);
    db.ref(ROOT + "/days/" + dateStr + "/items/" + id).remove();
  }

  function attachDayListener(){
    if(!db) return;
    if(dayRef) dayRef.off();
    var dateStr = fmtDate(currentDate);
    dayRef = db.ref(ROOT + "/days/" + dateStr);
    dayRef.on("value", function(snap){
      var val = snap.val() || {};
      currentDayData = {
        schedule: val.schedule || "",
        items: val.items || {}
      };
      renderSchedule();
      renderItemList();
      renderMasterChips();
    }, function(err){
      setSyncStatus("同期エラー: " + err.message, true);
    });
  }

  function attachMasterListener(){
    if(!db) return;
    db.ref(ROOT + "/masterItems").on("value", function(snap){
      masterItems = snap.val() || {};
      renderMasterChips();
      setSyncStatus("同期中");
    }, function(err){
      setSyncStatus("同期エラー: " + err.message, true);
    });
  }

  function goToDate(d){
    currentDate = d;
    renderDateNav();
    attachDayListener();
  }

  function init(){
    renderDateNav();
    renderItemList();
    renderMasterChips();

    document.getElementById("prevDayBtn").addEventListener("click", function(){
      var d = new Date(currentDate);
      d.setDate(d.getDate()-1);
      goToDate(d);
    });
    document.getElementById("nextDayBtn").addEventListener("click", function(){
      var d = new Date(currentDate);
      d.setDate(d.getDate()+1);
      goToDate(d);
    });
    document.getElementById("todayBtn").addEventListener("click", function(){
      goToDate(new Date());
    });
    document.getElementById("datePicker").addEventListener("change", function(e){
      var parts = e.target.value.split("-");
      if(parts.length === 3){
        var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
        goToDate(d);
      }
    });

    document.getElementById("scheduleInput").addEventListener("input", function(e){
      var text = e.target.value;
      clearTimeout(scheduleTimer);
      scheduleTimer = setTimeout(function(){
        if(!db) return;
        var dateStr = fmtDate(currentDate);
        db.ref(ROOT + "/days/" + dateStr + "/schedule").set(text);
      }, 500);
    });

    document.getElementById("itemList").addEventListener("click", function(e){
      var row = e.target.closest(".item-row");
      if(!row) return;
      var id = row.getAttribute("data-id");
      var action = e.target.getAttribute("data-action");
      if(action === "toggle"){
        toggleItem(id);
      } else if(action === "del"){
        deleteItemFromDay(id);
      }
    });

    document.getElementById("masterChips").addEventListener("click", function(e){
      var chip = e.target.closest(".chip");
      if(!chip) return;
      var id = chip.getAttribute("data-id");
      var name = chip.getAttribute("data-name");
      if(currentDayData.items && currentDayData.items[id]){
        return; // 既に追加済み
      }
      addItemToDay(id, name, false);
    });

    document.getElementById("addFreeTextBtn").addEventListener("click", submitFreeText);
    document.getElementById("freeTextInput").addEventListener("keydown", function(e){
      if(e.key === "Enter") submitFreeText();
    });

    function submitFreeText(){
      var input = document.getElementById("freeTextInput");
      var name = input.value.trim();
      if(!name) return;
      var id = nameToId(name);
      var isNew = !masterItems[id];
      addItemToDay(id, name, isNew);
      input.value = "";
    }

    if(db){
      attachDayListener();
      attachMasterListener();
    } else {
      setSyncStatus("Firebase初期化エラー", true);
    }
  }

  init();
})();
</script>
</body>
</html>
